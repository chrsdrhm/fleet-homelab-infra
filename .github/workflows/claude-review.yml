# Optional AI review of pull requests with Claude (anthropics/claude-code-action).
# It needs a Claude Pro or Max subscription: the CLAUDE_CODE_OAUTH_TOKEN secret comes
# from `claude setup-token`, and reviews count against that plan's usage, with no
# separate bill. Without the secret (no subscription, forks, Dependabot) the job skips
# with a notice. It is not a required check, so it never blocks a merge.
# Claude follows AGENTS.md ("When reviewing a pull request"). Setup:
# docs/github-setup.md in the infra repo.
name: Claude review

on:
  # Not on every push, to save the plan's usage. To review the latest commit again,
  # comment @claude on the pull request (only the repository owner can trigger it).
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review:
    name: claude-review
    # A comment triggers it only on a pull request, only with @claude, and only from
    # someone with write access (checked in the first step; this is a cheap pre-filter):
    # anyone can comment on a public repo, and each review uses the owner's plan and
    # secrets. Pull requests from forks are skipped (also in the first step).
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && contains(github.event.comment.body, '@claude')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # inline and summary review comments
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Check that the Claude token is set
        id: gate
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          # From a comment, only someone with write access (admin, maintain or write) can
          # start a review.
          permission="write"
          if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
            permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENTER/permission" --jq .permission || echo none)
          fi
          # From a comment the job holds the token even for a fork's pull request, and
          # Claude Code loads settings (including hooks, which run commands) from the
          # checked-out files. So @claude works only on this repository's own branches.
          head_repo=$GITHUB_REPOSITORY
          if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
            head_repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.head.repo.full_name // ""')
          fi
          if [ "$permission" != admin ] && [ "$permission" != write ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::@claude reviews only for people with write access to this repository."
          elif [ -z "$TOKEN" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::No CLAUDE_CODE_OAUTH_TOKEN secret here (it needs a Claude Pro or Max subscription; forks and Dependabot never get it)."
          elif [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::@claude doesn't review pull requests from forks, whose files could run code while the job holds the token."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # From a comment, the event is about the default branch: check out the PR's head.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      # 👀 on the @claude comment while the review runs; the last step swaps it for 🚀
      # when it's done, or 😕 if it failed, and just removes it if the run was cancelled
      # (a newer run takes over). GitHub has no ✅ reaction.
      - name: Acknowledge the @claude comment
        id: ack
        if: steps.gate.outputs.run == 'true' && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes --jq .id || true)
          echo "reaction=$id" >> "$GITHUB_OUTPUT"

      # As soon as the review starts, a "⏳ reviewing" comment goes at the bottom of the pull
      # request, linking to the live run. Earlier summaries (found by the marker) and earlier
      # inline comments are hidden as outdated, so what shows is this review's alone (it
      # raises anything still wrong again). A summary that can't be hidden is deleted. The
      # last step replaces this comment with the summary.
      - name: Post a review-in-progress comment
        id: progress
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- claude-review -->'
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          sha=${HEAD_SHA:-$(git rev-parse HEAD)}
          older=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | \"\\(.id) \\(.node_id)\"")
          inline=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .node_id')
          body="$marker"$'\n### 🤖 Claude review\n\n'"⏳ Reviewing commit \`${sha:0:7}\`… [Watch it live]($run_url)."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" --jq .id || true)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          while read -r old node; do
            [ -n "$old" ] || continue
            # shellcheck disable=SC2016 # $id is a GraphQL variable, not a shell one
            gh api graphql -f id="$node" \
              -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { clientMutationId } }' > /dev/null \
              || gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$old"
          done <<< "$older"
          while read -r node; do
            [ -n "$node" ] || continue
            # shellcheck disable=SC2016 # $id is a GraphQL variable, not a shell one
            gh api graphql -f id="$node" \
              -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { clientMutationId } }' > /dev/null || true
          done <<< "$inline"

      - name: Review with Claude
        id: review
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@aa8a7738e48bf30a40ee499ce818bef081c5ab5e # v1.0.257
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }} # the job's own token: no OIDC, no app to install
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this pull request as described in AGENTS.md, under "When reviewing a
            pull request". Check changes against Fleet's documented approach and Fleet's own
            GitOps setup (the references in AGENTS.md); fetch them when it matters.

            Get the change with `gh pr diff` (the checkout has no git history to diff
            against), and read files from the checkout for context.

            Comment only on things that matter: put specific issues as inline comments on
            the lines concerned. Do not post any other comment. Your final message is posted
            for you as the review's summary comment (updated in place on later runs), so make
            it only that summary, with no heading or preamble. Start it with a one-line
            verdict that begins with exactly one of:
              ✅ Good to merge: nothing that needs changing.
              ⚠️ Mergeable with changes suggested: minor points worth fixing, nothing blocking.
              ❌ Not ready to merge: a security problem, a private value, data loss, or a bug.
            Then list each finding as one line, most serious first, with its file. If there
            is nothing to raise, the verdict line is enough.

            This repository and its pull requests are public. Never quote, repeat or guess a
            private value (a hostname, domain, account ID, email address, token or ID); if
            you find one, point to the file and line only.
          # Tools: read the repo, fetch the references AGENTS.md names (Fleet's docs and
          # GitHub, plus the security standards' sites), and comment inline on this PR.
          # Model: the plan's default, unless the CLAUDE_REVIEW_MODEL repository variable
          # names one (for example claude-sonnet-5-5).
          claude_args: |
            --allowedTools "Read,Glob,Grep,WebFetch(domain:fleetdm.com),WebFetch(domain:docs.aws.amazon.com),WebFetch(domain:github.com),WebFetch(domain:raw.githubusercontent.com),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
            ${{ vars.CLAUDE_REVIEW_MODEL && format('--model {0}', vars.CLAUDE_REVIEW_MODEL) || '' }}

      # The summary replaces the review-in-progress comment: Claude's final message, plus a
      # collapsed usage table. If the review didn't finish, the comment says so and links
      # to the run. The table also goes to the run's summary page and this step's log, with
      # a list-price estimate (a subscription token is not billed per token). Numbers only:
      # the execution log itself holds the review's content and is not uploaded.
      - name: Post the review summary
        if: always() && steps.gate.outputs.run == 'true'
        env:
          LOG: ${{ steps.review.outputs.execution_file }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          PROGRESS_ID: ${{ steps.progress.outputs.id }}
          OUTCOME: ${{ steps.review.outcome }}
        run: |
          # A cancelled run was replaced by a newer one, which has already hidden this
          # run's "⏳ reviewing" comment and posts its own.
          [ "$OUTCOME" != cancelled ] || exit 0
          marker='<!-- claude-review -->'
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          post() { # replace the review-in-progress comment, or add one if it wasn't posted
            if [ -n "$PROGRESS_ID" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$PROGRESS_ID" -f body="$1" > /dev/null \
                || echo "::warning title=Summary not posted::The review-in-progress comment is gone."
            else
              gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$1" --jq .html_url
            fi
          }
          unfinished() {
            echo "::warning title=No summary::$1"
            post "$marker"$'\n### 🤖 Claude review\n\n'"😕 The review didn't finish. See the [workflow run]($run_url)."
            exit 0
          }
          if [ ! -f "$LOG" ] || ! result=$(jq -ec '[.[] | select(.type == "result")] | last' "$LOG"); then
            unfinished "The review's execution log has no result."
          fi
          n() { jq -r 'def c: if length > 3 then (.[:-3] | c) + "," + .[-3:] else . end; '"$1" <<< "$result"; }
          total='((.usage.input_tokens // 0) + (.usage.cache_read_input_tokens // 0) + (.usage.cache_creation_input_tokens // 0))'
          input=$(n "$total | tostring | c")
          cached=$(n '.usage.cache_read_input_tokens // 0 | tostring | c')
          cache_pct=$(n "if $total > 0 then (.usage.cache_read_input_tokens // 0) * 100 / $total | round else 0 end")
          output=$(n '.usage.output_tokens // 0 | tostring | c')
          turns=$(n '.num_turns // 0')
          secs=$(n '(.duration_ms // 0) / 1000 | floor')
          cost=$(n '.total_cost_usd // 0 | . * 100 | round / 100')
          rows=("| | |" "|---|---|" "| Input tokens | $input |" "| Read from cache | $cached ($cache_pct%) |" \
            "| Output tokens | $output |" "| Turns | $turns |" "| Duration | ${secs}s |")
          printf '%s\n' "### Claude review usage" "" "${rows[@]}" \
            "| List-price estimate (not billed on a subscription) | \$$cost |" | tee -a "$GITHUB_STEP_SUMMARY"

          summary=$(n 'if .is_error then "" else (.result // "") end')
          # Start at the verdict line, in case the final message has a stray line before it.
          if grep -qE '^(✅|⚠️|❌)' <<< "$summary"; then
            summary=$(sed -nE '/^(✅|⚠️|❌)/,$p' <<< "$summary")
          fi
          [ -n "$summary" ] || unfinished "The review ended without a summary (see the review step's log)."
          usage=$(printf '%s\n' "<details><summary>📊 Usage summary</summary>" "" "${rows[@]}" "" "</details>")
          post "$marker"$'\n### 🤖 Claude review\n\n'"$summary"$'\n\n'"$usage"

      - name: Mark the @claude comment as done
        if: always() && steps.ack.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REACTION: ${{ steps.ack.outputs.reaction }}
          OUTCOME: ${{ steps.review.outcome }}
        run: |
          if [ -n "$REACTION" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions/$REACTION" || true
          fi
          [ "$OUTCOME" != cancelled ] || exit 0
          done_as=rocket
          [ "$OUTCOME" = success ] || done_as=confused
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content="$done_as" > /dev/null || true
