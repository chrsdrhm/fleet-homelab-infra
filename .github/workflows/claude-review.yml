# Optional AI review of pull requests with Claude (anthropics/claude-code-action).
# It needs a Claude Pro or Max subscription: the CLAUDE_CODE_OAUTH_TOKEN secret comes
# from `claude setup-token`, and reviews count against that plan's usage, with no
# separate bill. Without the secret (no subscription, forks, Dependabot) the job skips
# with a notice. It is not a required check, so it never blocks a merge.
# Claude follows AGENTS.md ("When reviewing a pull request"). Setup:
# docs/github-setup.md in the infra repo.
name: Claude review

on:
  pull_request:
    # Not on every push, to save the plan's usage. Re-run from the Actions tab
    # after pushing changes you want reviewed again.
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  review:
    name: claude-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # inline and summary review comments
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check that the Claude token is set
        id: gate
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::No CLAUDE_CODE_OAUTH_TOKEN secret here (it needs a Claude Pro or Max subscription; forks and Dependabot never get it)."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review with Claude
        id: review
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }} # the job's own token: no OIDC, no app to install
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as described in AGENTS.md, under "When reviewing a
            pull request". Check changes against Fleet's documented approach and Fleet's own
            GitOps setup (the references in AGENTS.md); fetch them when it matters.

            Comment only on things that matter: put specific issues as inline comments on
            the lines concerned. Always finish by posting exactly one summary comment with
            `gh pr comment`, even when you found nothing. Start it with the heading line
            `### 🤖 Claude review`, then a blank line, then a one-line verdict that begins
            with exactly one of:
              ✅ Good to merge: nothing that needs changing.
              ⚠️ Mergeable with changes suggested: minor points worth fixing, nothing blocking.
              ❌ Not ready to merge: a security problem, a private value, data loss, or a bug.
            Then list each finding as one line, most serious first, with its file. If there
            is nothing to raise, the verdict line is enough.

            This repository and its pull requests are public. Never quote, repeat or guess a
            private value (a hostname, domain, account ID, email address, token or ID); if
            you find one, point to the file and line only.
          # Tools: read the repo, fetch the references AGENTS.md names (Fleet's docs and
          # GitHub, plus the security standards' sites), and comment on this PR.
          # Model: the plan's default, unless the CLAUDE_REVIEW_MODEL repository variable
          # names one (for example claude-sonnet-5-5).
          claude_args: |
            --allowedTools "Read,Glob,Grep,WebFetch(domain:fleetdm.com),WebFetch(domain:docs.aws.amazon.com),WebFetch(domain:github.com),WebFetch(domain:raw.githubusercontent.com),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            ${{ vars.CLAUDE_REVIEW_MODEL && format('--model {0}', vars.CLAUDE_REVIEW_MODEL) || '' }}

      # How much this review used: a table in the run's summary page and the step log,
      # and a collapsed "Usage summary" at the end of Claude's summary comment. Numbers only: the execution
      # log itself holds the review's content and is not uploaded. The cost is a
      # list-price estimate (summary page only); a subscription token is not billed per token.
      - name: Record usage
        if: always() && steps.review.outputs.execution_file != ''
        env:
          LOG: ${{ steps.review.outputs.execution_file }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f "$LOG" ] || ! usage=$(jq -ec '[.[] | select(.type == "result")] | last' "$LOG"); then
            echo "::warning title=No usage figures::The review's execution log has no usage figures."
            exit 0
          fi
          n() { jq -r "$1" <<< "$usage"; }
          cached=$(n '.usage.cache_read_input_tokens // 0')
          input=$(n '(.usage.input_tokens // 0) + (.usage.cache_read_input_tokens // 0) + (.usage.cache_creation_input_tokens // 0)')
          output=$(n '.usage.output_tokens // 0')
          turns=$(n '.num_turns // 0')
          secs=$(n '(.duration_ms // 0) / 1000 | floor')
          cost=$(n '.total_cost_usd // 0 | . * 100 | round / 100')
          printf '%s\n' "### Claude review usage" "" "| | |" "|---|---|" \
            "| Input tokens | $input ($cached read from cache) |" \
            "| Output tokens | $output |" \
            "| Turns | $turns |" \
            "| Duration | ${secs}s |" \
            "| List-price estimate (not billed on a subscription) | \$$cost |" | tee -a "$GITHUB_STEP_SUMMARY"

          # Only this run's summary comment: posted since this run attempt started.
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" --jq .run_started_at)
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and .created_at >= \"$started\" and (.body | startswith(\"### 🤖 Claude review\")) and (.body | contains(\"📊 Usage summary\") | not)) | .id" | tail -1)
          if [ -n "$id" ]; then
            body=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq .body)
            usage_block=$(printf '%s\n' "<details><summary>📊 Usage summary</summary>" "" "| | |" "|---|---|" \
              "| Input tokens | $input ($cached read from cache) |" "| Output tokens | $output |" \
              "| Turns | $turns |" "| Duration | ${secs}s |" "" "</details>")
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -f body="$body"$'\n\n'"$usage_block" > /dev/null
          else
            echo "::notice title=Usage not added to the PR::No summary comment from this run starting with the expected heading; the usage is in this run's summary."
          fi
