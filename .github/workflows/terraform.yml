# Terraform for this stack, in four jobs (plus lint-comment, which comments on the PR
# when lint fails):
#  - lint:  on every pull request, no AWS: checks/run.sh (private values, fmt, validate,
#           terraform test, shellcheck, actionlint, zizmor, tflint; see checks/README.md).
#  - plan:  after lint, a read-only plan with the plan role, and a PR comment with a
#           summary and the full plan, masked (comments are public and NOT masked by GitHub).
#           Each plan is a new comment; earlier ones are hidden as outdated.
#           A plan that destroys or replaces a resource holding data fails the check unless
#           the pull request has the `allow-destroy` label (checks/data-loss-guard.sh).
#  - apply: started by hand (up or down with the apply role), and nightly, when it
#           tears the stack down if it was left up (or, if GitHub started it after
#           7:59am, opens an issue saying it's still up). A failed down (either kind)
#           opens an issue that the next successful down closes, and the nightly run
#           lists kept snapshots older than 14 days in another, and a newer Fleet release
#           in a third (scripts/notify-issue.sh).
#  - release-review: after a nightly run that found a Fleet release not yet reviewed (or
#           by hand, as action=review), Claude reviews the releases in between against
#           this setup (scripts/release-review.sh) and adds the verdict to that issue.
#           Signs in to the Claude API with workload identity federation, no API key.
#  - apply-on-merge: on every push to main (a merged pull request): if the stack is up,
#           plan and apply main, so a change goes live on merge; if it's down, nothing
#           happens (the next up applies main). The data-loss guard runs again here.
# AWS access is keyless (OIDC). The apply role in oidc.tf only trusts runs on main,
# which only a merge or a manual run can start, so a pull request cannot get it even by
# editing this file. Values that identify
# the deployment come from secrets, which GitHub masks in these public logs. Forks get
# no secrets, so their plan is skipped; Dependabot PRs use Dependabot secrets.
name: Terraform
run-name: "${{ github.event_name == 'pull_request' && format('Terraform plan: {0}', github.event.pull_request.title) || github.event_name == 'push' && 'Terraform apply on merge' || github.event_name == 'schedule' && 'Terraform nightly check (down if up)' || format('Terraform {0}', inputs.action) }}"

on:
  pull_request:
    # labeled/unlabeled: re-check when the `allow-destroy` label is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
    # Docs-only merges change nothing in AWS.
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  # Nightly: if the stack was left up, tear it down. Cron is UTC and doesn't follow
  # daylight saving, so 07:17 UTC is 2:17am in Chicago in summer (CDT) and 1:17am in
  # winter (CST). GitHub often starts it late; the job acts until 7:59am in Chicago.
  # :17, not :00: GitHub delays scheduled runs most at the top of the hour.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        type: choice
        options:
          - up
          - down
          - review
      confirm:
        description: "For down only: type destroy"
        required: false
        type: string
      review_from:
        description: "For review only: the version upgraded from, like 4.93.0"
        required: false
        type: string
      review_to:
        description: "For review only: the version upgraded to, like 4.93.2"
        required: false
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"
  TF_CLI_ARGS: "-no-color"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: terraform-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: terraform-lint-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      failed: ${{ steps.checks.outputs.failed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the private-values check diffs against the base branch

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.8"
          terraform_wrapper: false

      # Everything else lives in checks/ (see checks/README.md): the same script runs
      # locally. Without checks/, the fallback below still runs fmt and validate.
      - name: Install check tools
        if: hashFiles('checks/install-tools.sh') != ''
        run: checks/install-tools.sh

      - name: Run checks
        id: checks
        if: hashFiles('checks/run.sh') != ''
        env:
          PRIVATE_HASHES: ${{ secrets.PRIVATE_HASHES }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export FLEET_HOMELAB_PRIVATE_HASHES="$RUNNER_TEMP/private-hashes"
          printf '%s\n' "$PRIVATE_HASHES" > "$FLEET_HOMELAB_PRIVATE_HASHES"
          if [ -z "$PRIVATE_HASHES" ]; then
            echo "::notice title=Patterns only::No PRIVATE_HASHES secret here (for example, a fork), so the private-values check uses its patterns only."
          fi
          status=0
          checks/run.sh | tee "$RUNNER_TEMP/checks.log" || status=$?
          # Only the names of the failed checks go to the lint-comment job, never their output.
          echo "failed=$(sed -n 's/^Failed: //p' "$RUNNER_TEMP/checks.log")" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: terraform fmt and validate (without checks/)
        if: hashFiles('checks/run.sh') == ''
        run: |
          terraform fmt -check -recursive -diff
          for dir in . okta; do
            terraform -chdir="$dir" init -input=false -backend=false > /dev/null
            terraform -chdir="$dir" validate
          done

  # When lint fails, one PR comment names the failed checks and links to the job; it is
  # updated in place, and deleted once lint passes. A separate job, so the pull
  # request's own code (which lint runs) never holds a token that can write to the PR.
  lint-comment:
    name: lint-comment
    needs: lint
    if: >-
      always() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (needs.lint.result == 'failure' || needs.lint.result == 'success')
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 5
    permissions:
      pull-requests: write
      actions: read
    concurrency:
      group: lint-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RESULT: ${{ needs.lint.result }}
          FAILED: ${{ needs.lint.outputs.failed }}
          LINT_JOB: terraform-lint
        run: |
          marker='<!-- lint-report -->'
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" | tail -1)
          if [ "$RESULT" = success ]; then
            # Lint passes: remove the earlier failure comment, if there is one.
            [ -z "$id" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
            exit 0
          fi
          job_url=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq ".jobs[] | select(.name == \"$LINT_JOB\") | .html_url" | head -1)
          [ -n "$job_url" ] || job_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          names=$(printf '%s' "$FAILED" | tr -cd 'a-z -' | xargs) # check names only
          if [ -n "$names" ]; then
            read -ra each <<< "$names"
            list=$(printf "\`%s\`, " "${each[@]}"); list=${list%, }
            body="$marker"$'\n### 🧹 Lint\n\n'"❌ **Failed:** $list."$'\n\n'"See the [workflow job]($job_url) for the details, or run \`checks/run.sh $names\` locally."
          else
            body="$marker"$'\n### 🧹 Lint\n\n'"❌ **Failed.** See the [workflow job]($job_url) for the details."
          fi
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

  plan:
    name: terraform-plan
    needs: lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 60 # up to 40 waiting for a manual up/down, then the plan
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      actions: read
    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check that secrets are available
        id: gate
        env:
          ROLE: ${{ secrets.AWS_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Plan skipped::This pull request runs without the repository's secrets (for example, from a fork), so no plan can be made."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: steps.gate.outputs.run == 'true'

      # The same wait as the apply on merge: a plan made halfway through an up or down
      # shows misleading creates or destroys. Before signing in to AWS, like there.
      - name: Wait for a running up or down
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 80); do
            busy=0
            for event in workflow_dispatch schedule; do
              n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow terraform.yml --event "$event" --limit 20 \
                --json status --jq 'map(select(.status != "completed")) | length')
              busy=$((busy + n))
            done
            [ "$busy" = 0 ] && exit 0
            echo "Waiting for a manual up or down to finish…"
            sleep 30
          done
          echo "::error title=Still busy::a manual up or down is still running after 40 minutes. Nothing was planned; re-run this job once it finishes."
          exit 1

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        if: steps.gate.outputs.run == 'true'
        with:
          role-arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}
        env:
          FLEET_SUBDOMAIN: ${{ secrets.FLEET_SUBDOMAIN }}
          FLEET_LICENSE_KEY: ${{ secrets.FLEET_LICENSE_KEY }}
          CLOUDFLARE_ZONE_NAME: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          WAF_CI_HEADER_VALUE: ${{ secrets.WAF_CI_HEADER_VALUE }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_OWNER_ID: ${{ github.repository_owner_id }}
          GH_REPO_ID: ${{ github.repository_id }}

      # -lock=false: the plan role is read-only and cannot write the S3 lock file.
      # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error.
      - name: terraform plan
        id: plan
        if: steps.gate.outputs.run == 'true'
        run: |
          set +e
          terraform plan -input=false -lock=false -detailed-exitcode -var-file=terraform.tfvars -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

          # Data-loss guard (checks/data-loss-guard.sh, if present): resources this plan
          # would destroy or replace that hold data or identity.
          : > data-loss.txt
          if [ "$code" = "2" ] && [ -x checks/data-loss-guard.sh ]; then
            checks/data-loss-guard.sh tfplan > data-loss.txt
          fi
          if [ -s data-loss.txt ]; then
            echo "::warning title=Data at risk::this plan destroys or replaces $(wc -l < data-loss.txt | tr -d ' ') resource(s) that hold data; see the PR comment."
          fi

      # The comment is public and GitHub does NOT mask it, so every secret value and the
      # account ID are replaced first (the same masking the run log gets). The summary
      # (plan line + changing resources) must pass a 12-digit check or nothing is posted.
      # The full plan is added only if the whole comment stays within 60,000 characters
      # and it holds no 12-digit number; otherwise the comment links to this job instead.
      # down.sh destroys module.fleet, so its absence from the state means the stack is
      # down: the plan then shows the whole stack to add, and the comment says why
      # (merging never builds it: the apply on merge skips a torn-down stack).
      - name: Check whether the stack is up
        id: stack
        if: steps.gate.outputs.run == 'true'
        run: |
          resources=$(terraform state list)
          if grep -q '^module\.fleet\.' <<< "$resources"; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the plan comment
        if: steps.gate.outputs.run == 'true'
        env:
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
          STACK_UP: ${{ steps.stack.outputs.up }}
          GH_TOKEN: ${{ github.token }}
          FLEET_SUBDOMAIN: ${{ secrets.FLEET_SUBDOMAIN }}
          CLOUDFLARE_ZONE_NAME: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          FLEET_LICENSE_KEY: ${{ secrets.FLEET_LICENSE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WAF_CI_HEADER_VALUE: ${{ secrets.WAF_CI_HEADER_VALUE }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          job_url=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name == "terraform-plan") | .html_url' | head -1)
          [ -n "$job_url" ] || job_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          mask() {
            # Longest values first, so a value that contains another (the email address
            # contains the domain) is masked whole rather than leaving part of it showing.
            local text="$1" v
            while IFS= read -r v; do
              [ -n "$v" ] && text=${text//"$v"/***}
            done < <(printf '%s\n' "$FLEET_SUBDOMAIN" "$CLOUDFLARE_ZONE_NAME" "$TF_STATE_BUCKET" "$BUDGET_ALERT_EMAIL" \
                       "$FLEET_LICENSE_KEY" "$CLOUDFLARE_API_TOKEN" "$WAF_CI_HEADER_VALUE" "$account" \
                     | awk '{ print length($0) "\t" $0 }' | sort -rn | cut -f2-)
            # Route 53 name servers: the set of four can lead back to the domain.
            printf '%s' "$text" | sed -E 's/ns-[0-9]+\.awsdns-[0-9]+\.[a-z.]+/<name-server>/g'
          }
          has12() { printf '%s' "$1" | grep -qE '(^|[^0-9])[0-9]{12}([^0-9]|$)'; }

          if [ "$EXITCODE" = "1" ]; then
            summary="**The plan failed.** The error is in the full output below."
          else
            headline=$(grep -m1 -E '^(Plan:|No changes\.)' plan.txt || true)
            if [ -z "$headline" ] && grep -q '^Changes to Outputs:' plan.txt; then
              headline="No resource changes; only output values change."
            fi
            headline="${headline:-No plan line found.}"
            # The backticks in the sed replacements are Markdown code spans, not shell.
            # shellcheck disable=SC2016
            rows=$(grep -E '^[[:space:]]*# .* (will be created|will be updated in-place|will be destroyed|must be replaced|will be replaced|will be read during apply)$' plan.txt \
              | sed -E 's/^[[:space:]]*# //; s/\["[^"]*"\]/["…"]/g' \
              | sed -E 's/^(.*) will be created$/| create | `\1` |/; s/^(.*) will be updated in-place$/| update | `\1` |/; s/^(.*) will be destroyed$/| destroy | `\1` |/; s/^(.*) (must|will) be replaced$/| replace | `\1` |/; s/^(.*) will be read during apply$/| read | `\1` |/' \
              | head -100 || true)
            summary="**${headline}**"
            [ -n "$rows" ] && summary+=$'\n\n| Action | Resource |\n|---|---|\n'"$rows"
          fi
          summary=$(mask "$summary")
          if has12 "$summary"; then
            echo "::error title=Not posted::the summary still contains a 12-digit number (an account ID?)"
            exit 1
          fi

          head=$'<!-- terraform-plan -->\n### 🏗️ Terraform plan\n\n'
          if [ "$STACK_UP" = "false" ]; then
            head+=$'⏸️ **The stack is down, so this is what the next `up` will build.** Merging this pull request won\'t apply it.\n\n'
          fi
          if [ -s data-loss.txt ]; then
            caution=$'> [!CAUTION]\n> **This plan destroys or replaces resources that hold data:**\n'
            while IFS= read -r line; do caution+=$'> - `'"$line"$'`\n'; done < data-loss.txt
            caution+=$'>\n> The check fails unless this pull request has the `allow-destroy` label.\n\n'
            head+=$(mask "$caution")$'\n\n'
          fi
          head+="$summary"
          foot=$'\n\n_The full log is in the [workflow job]('"$job_url"$')._\n'
          # Only the plan itself: drop the refresh and read progress lines (they stay in the
          # job log), keeping drift notes, the plan, warnings and errors.
          full=$(grep -vE ': (Refreshing state\.\.\.|Reading\.\.\.|Read complete after |Still (reading|refreshing)\.\.\.)' plan.txt \
            | sed -e '/./,$!d' || true)
          full=$(mask "$full")
          details=$'\n\n<details><summary>Plan details</summary>\n\n````\n'"$full"$'\n````\n\n</details>'
          if has12 "$full"; then
            details=$'\n\n_The full plan is not shown here because it contains a 12-digit number, which could be an account ID. See the [workflow job]('"$job_url"$')._'
            foot=$'\n'
          elif [ $(( ${#head} + ${#details} + ${#foot} )) -gt 60000 ]; then
            details=$'\n\n_The full plan is too long for a comment. See it in the [workflow job]('"$job_url"$')._'
            foot=$'\n'
          fi

          printf '%s' "$head$details$foot" > comment.md

      - name: Comment on the pull request
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Each plan is a new comment at the bottom of the pull request, so it's clear it ran
          # again. Earlier plan comments (found by the marker) are hidden as outdated, or
          # deleted if that fails, so only the latest shows.
          older=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- terraform-plan -->"))) | "\(.id) \(.node_id)"')
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          while read -r id node; do
            [ -n "$id" ] || continue
            # shellcheck disable=SC2016 # $id is a GraphQL variable, not a shell one
            gh api graphql -f id="$node" \
              -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { clientMutationId } }' > /dev/null \
              || gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
          done <<< "$older"

      - name: Fail if the plan failed
        if: steps.gate.outputs.run == 'true' && steps.plan.outputs.exitcode == '1'
        run: |
          echo "::error title=Plan failed::terraform plan returned an error; see the 'terraform plan' step log."
          exit 1

      - name: Fail if the plan destroys data without allow-destroy
        if: steps.gate.outputs.run == 'true'
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          [ -s data-loss.txt ] || exit 0
          if [[ ",$LABELS," == *",allow-destroy,"* ]]; then
            echo "::notice title=Data loss accepted::the allow-destroy label is on this pull request."
          else
            echo "::error title=Data at risk::this plan destroys or replaces resources that hold data. Add the allow-destroy label if that is intended."
            exit 1
          fi

      - name: Remove the generated files
        if: always()
        run: rm -f terraform.tfvars backend.hcl plan.txt comment.md tfplan data-loss.txt

  apply:
    name: terraform-apply
    if: (github.event_name == 'workflow_dispatch' && inputs.action != 'review') || github.event_name == 'schedule'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
      issues: write # the nightly run's notices (scripts/notify-issue.sh)
    concurrency:
      group: terraform
      cancel-in-progress: false
    outputs:
      review_from: ${{ steps.release.outputs.review_from }}
      review_to: ${{ steps.release.outputs.review_to }}
    env:
      # Wait for the state lock (held by an apply on merge, say) instead of failing. 15
      # minutes, so a wait and the work fit in the AWS session's hour.
      TF_CLI_ARGS_plan: "-lock-timeout=15m"
      TF_CLI_ARGS_apply: "-lock-timeout=15m"
      TF_CLI_ARGS_destroy: "-lock-timeout=15m"
    steps:
      # Decides what this run does, before touching AWS: a manual run does what was
      # asked (down needs confirm=destroy). The nightly run does nothing while
      # AUTO_DOWN_SKIP_UNTIL (YYYY-MM-DD) is today or later in Chicago: it's the last day
      # the stack stays up, and the check the night after runs as usual. Otherwise it
      # tears down between midnight and 7:59am in Chicago, and later than that only
      # reports (action=late), never tearing down a stack that may be in use.
      - name: Decide what to run
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
          SKIP_UNTIL: ${{ vars.AUTO_DOWN_SKIP_UNTIL }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$ACTION" = "down" ] && [ "$CONFIRM" != "destroy" ]; then
              echo "::error title=Down not confirmed::'down' needs the confirm input set to exactly: destroy. Nothing was changed."
              exit 1
            fi
            echo "action=$ACTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(TZ=America/Chicago date +%F)
          if [ -n "$SKIP_UNTIL" ] && [[ ! "$today" > "$SKIP_UNTIL" ]]; then
            echo "::notice title=Nightly teardown skipped::AUTO_DOWN_SKIP_UNTIL is $SKIP_UNTIL, so the stack stays up tonight."
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub can start a scheduled run hours late (once at 11:34am, once at 7:03am).
          hour=$(TZ=America/Chicago date +%-H)
          if [ "$hour" -gt 7 ]; then
            echo "::notice title=Nightly check ran late::GitHub started it at $(TZ=America/Chicago date +%H:%M) in Chicago, after the teardown window, so it only reports."
            echo "action=late" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "action=nightly" >> "$GITHUB_OUTPUT"

      - name: Check out the repository
        if: steps.mode.outputs.action != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        if: steps.mode.outputs.action != 'none'
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
        env:
          FLEET_SUBDOMAIN: ${{ secrets.FLEET_SUBDOMAIN }}
          FLEET_LICENSE_KEY: ${{ secrets.FLEET_LICENSE_KEY }}
          CLOUDFLARE_ZONE_NAME: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          WAF_CI_HEADER_VALUE: ${{ secrets.WAF_CI_HEADER_VALUE }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_OWNER_ID: ${{ github.repository_owner_id }}
          GH_REPO_ID: ${{ github.repository_id }}

      # Scheduled only: down.sh destroys module.fleet, so its absence from the state
      # means the stack is already down and there's nothing to do. Captured first, so an
      # error fails the run instead of reading as "down".
      - name: Is the stack up?
        id: nightly
        if: steps.mode.outputs.action == 'nightly' || steps.mode.outputs.action == 'late'
        env:
          ACTION: ${{ steps.mode.outputs.action }}
        run: |
          resources=$(terraform state list)
          if ! grep -q '^module\.fleet\.' <<< "$resources"; then
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "The stack is down; nothing to do."
          elif [ "$ACTION" = nightly ]; then
            echo "up=true" >> "$GITHUB_OUTPUT"
            echo "down=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Stack left up::The stack was still up overnight, so it's being torn down."
          else
            echo "up=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Stack left up::The stack is still up, and this check started too late to tear it down."
          fi

      # A late check leaves the stack up, so say so: it bills until someone runs down.
      # The issue closes once a teardown succeeds, or a scheduled check finds it down.
      - name: Report a stack left up
        if: steps.mode.outputs.action == 'late' && steps.nightly.outputs.up == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          when=$(TZ=America/Chicago date '+%a %b %-d, %-I:%M %p')
          # shellcheck disable=SC2016 # the backticks are Markdown, for the issue body
          printf '@%s GitHub started the nightly check late (%s Chicago time), after the teardown window, so the stack is still up and billing (about $0.25 an hour). Run `down` if you are not using it, or `/session-end`. This issue closes itself when a teardown succeeds.\n\nRun: %s\n' \
            "$OWNER" "$when" "$RUN_URL" > left-up.md
          ./scripts/notify-issue.sh report "The nightly teardown didn't run" left-up.md

      # A GitHub App token (GitOps repo only, Actions write, revoked when the job ends)
      # lets up.sh start the GitOps workflow; this run's own token cannot. Best effort:
      # without it, up.sh still rebuilds and warns that the GitOps run did not start.
      - name: Get a token for the GitOps repo
        id: gitops-token
        if: steps.mode.outputs.action == 'up'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: fleet-homelab-gitops
          permission-actions: write

      # FLEET_CI_HEADER gets up.sh's health check past the WAF's US-only rule.
      - name: Up
        if: steps.mode.outputs.action == 'up'
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
          FLEET_CI_HEADER: ${{ secrets.WAF_CI_HEADER_VALUE }}
        run: ./scripts/up.sh

      - name: Down
        id: down
        if: steps.mode.outputs.action == 'down' || steps.nightly.outputs.down == 'true'
        env:
          CONFIRM: destroy # a manual run was checked above; the nightly one is automatic
        run: ./scripts/down.sh

      # A failed teardown may leave the stack partly up and billing, so it opens an issue
      # (or comments on the open one) that stays open until a later down succeeds, which
      # closes it. GitHub sends issues to the owner by email and in its app. A successful
      # teardown needs no notice.
      - name: Report a failed teardown
        if: always() && steps.down.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          when=$(TZ=America/Chicago date '+%a %b %-d, %-I:%M %p') # Chicago time, like the schedule
          if [ "$EVENT" = schedule ]; then what="The nightly check found the stack up, and its teardown failed"; else what="A manual teardown failed"; fi
          # shellcheck disable=SC2016 # the backticks are Markdown, for the issue body
          printf '@%s %s (%s Chicago time). The stack may still be partly up and billing: check the run, fix the cause, and run `down` again. This issue closes itself when a teardown succeeds.\n\nRun: %s\n' \
            "$OWNER" "$what" "$when" "$RUN_URL" > notice.md
          ./scripts/notify-issue.sh report "The teardown failed" notice.md

      - name: Close the failed-teardown issue
        if: steps.down.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./scripts/notify-issue.sh resolve "The teardown failed" "A teardown succeeded: $RUN_URL"

      - name: Close the left-up issue
        if: steps.down.outcome == 'success' || steps.nightly.outputs.up == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./scripts/notify-issue.sh resolve "The nightly teardown didn't run" "The stack is down: $RUN_URL"

      # Snapshots other than down.sh's own teardown ones are kept on purpose (such as a
      # pre-upgrade snapshot) and bill until someone deletes them. Nightly, list any older
      # than 14 days in one issue, and close it once there are none. Never deletes.
      - name: Check for kept snapshots
        if: always() && (steps.mode.outputs.action == 'nightly' || steps.mode.outputs.action == 'late')
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Captured first, so an AWS error fails the step instead of reading as "none".
          kept=$(aws rds describe-db-cluster-snapshots --snapshot-type manual \
            --query "DBClusterSnapshots[?!starts_with(DBClusterSnapshotIdentifier, 'fleet-homelab-teardown-')].[DBClusterSnapshotIdentifier,SnapshotCreateTime]" \
            --output text)
          now=$(date -u +%s)
          old=""
          while read -r name created; do
            [ -n "$name" ] || continue
            days=$(( (now - $(date -u -d "$created" +%s)) / 86400 ))
            if [ "$days" -ge 14 ]; then
              old+="- \`$name\`: $days days old"$'\n'
            fi
          done <<< "$kept"
          title="Kept snapshots older than 14 days"
          if [ -z "$old" ]; then
            ./scripts/notify-issue.sh resolve "$title" "None left; closing."
          else
            # shellcheck disable=SC2016 # the backticks are Markdown, for the issue body
            {
              printf '@%s These Aurora snapshots are not teardown snapshots, so `down.sh` keeps them, and each bills until deleted:\n\n%s\n' "$OWNER" "$old"
              printf 'Delete one once you no longer need it (after an upgrade has run cleanly, say), with `/session-end` or:\n\n'
              printf '```bash\naws rds delete-db-cluster-snapshot --db-cluster-snapshot-identifier <name>\n```\n\nThis issue updates nightly and closes itself when none are left.\n'
            } > snapshots.md
            ./scripts/notify-issue.sh update "$title" snapshots.md
          fi

      # Dependabot can't watch the Fleet image: fleetdm/fleet has tens of thousands of
      # tags (one per branch build), and listing them never finishes. Instead, nightly,
      # compare fleet.Dockerfile with Fleet's newest release that's at least 7 days old (the
      # same wait as Dependabot's cooldown), and keep one issue open while it's newer.
      # The release-review job adds Claude's review to the issue, with a marker naming the
      # versions; while the marker matches, the issue is left alone, so each upgrade is
      # reviewed once. A failed review leaves no marker, so the next night tries again.
      - name: Check for a newer Fleet release
        id: release
        if: always() && (steps.mode.outputs.action == 'nightly' || steps.mode.outputs.action == 'late')
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          current=$(sed -n 's|^FROM fleetdm/fleet:v||p' fleet.Dockerfile)
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # Captured first, so an API error fails the step instead of reading as "none".
          releases=$(gh api 'repos/fleetdm/fleet/releases?per_page=100')
          latest=$(jq -r --arg cutoff "$cutoff" '.[]
            | select((.draft or .prerelease) | not)
            | select(.tag_name | test("^fleet-v[0-9]+\\.[0-9]+\\.[0-9]+$"))
            | select(.published_at <= $cutoff)
            | .tag_name | ltrimstr("fleet-v")' <<< "$releases" | sort -V | tail -n 1)
          if [ -z "$current" ] || [ -z "$latest" ]; then
            echo "::error title=Fleet release check::Couldn't read the current version ('$current') or the newest release ('$latest')."
            exit 1
          fi
          title="A newer Fleet release is available"
          if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)" = "$current" ]; then
            ./scripts/notify-issue.sh resolve "$title" "fleet.Dockerfile is on $current, the newest release at least 7 days old; closing."
          elif ./scripts/notify-issue.sh show "$title" | grep -qF "<!-- release-review: $current..$latest -->"; then
            echo "The issue already has a review of $current to $latest."
          else
            # shellcheck disable=SC2016 # the backticks are Markdown, for the issue body
            {
              printf '@%s Fleet %s has been out for at least 7 days; `fleet.Dockerfile` is on %s.\n\n' "$OWNER" "$latest" "$current"
              printf 'Release notes: https://github.com/fleetdm/fleet/releases/tag/fleet-v%s\n\n' "$latest"
              printf 'Upgrade with `/fleet-upgrade` or by following `docs/upgrading-fleet.md` (snapshot first). This issue updates nightly and closes itself once `fleet.Dockerfile` is current.\n'
            } > release.md
            ./scripts/notify-issue.sh update "$title" release.md
            echo "review_from=$current" >> "$GITHUB_OUTPUT"
            echo "review_to=$latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove the generated files
        if: always()
        run: rm -f terraform.tfvars backend.hcl notice.md snapshots.md release.md left-up.md

  apply-on-merge:
    name: terraform-apply-on-merge
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 120 # up to 40 waiting for a manual up/down, then up to an hour signed in to AWS
    permissions:
      id-token: write
      contents: read
      pull-requests: read # the merged pull request's labels, for allow-destroy
      actions: read # to wait for a running up or down
    # Its own group: GitHub keeps one pending run per group, so sharing up/down's group
    # could drop a queued up or down. A newer merge replacing an older pending one is
    # fine: it applies a main that includes it. Against up/down, the job first waits for
    # them to finish, and Terraform's state lock (waited on, not failed) covers the rest.
    concurrency:
      group: terraform-apply-on-merge
      cancel-in-progress: false
    env:
      TF_CLI_ARGS_plan: "-lock-timeout=15m"
      TF_CLI_ARGS_apply: "-lock-timeout=15m"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before signing in to AWS, so the wait doesn't eat into the session's hour.
      - name: Wait for a running up or down
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 80); do
            busy=0
            for event in workflow_dispatch schedule; do
              n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow terraform.yml --event "$event" --limit 20 \
                --json status --jq 'map(select(.status != "completed")) | length')
              busy=$((busy + n))
            done
            [ "$busy" = 0 ] && exit 0
            echo "Waiting for a manual up or down to finish…"
            sleep 30
          done
          echo "::error title=Still busy::a manual up or down is still running after 40 minutes. Nothing was applied; the next up applies main."
          exit 1

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
        env:
          FLEET_SUBDOMAIN: ${{ secrets.FLEET_SUBDOMAIN }}
          FLEET_LICENSE_KEY: ${{ secrets.FLEET_LICENSE_KEY }}
          CLOUDFLARE_ZONE_NAME: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          WAF_CI_HEADER_VALUE: ${{ secrets.WAF_CI_HEADER_VALUE }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_OWNER_ID: ${{ github.repository_owner_id }}
          GH_REPO_ID: ${{ github.repository_id }}

      # down.sh destroys module.fleet, so its absence from the state means the stack is
      # down. Applying then would build the whole stack, so this waits for the next up.
      - name: Check whether the stack is up
        id: stack
        run: |
          # Captured first, so an error (credentials, backend) fails the step rather than
          # reading as "down".
          resources=$(terraform state list)
          if grep -q '^module\.fleet\.' <<< "$resources"; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Stack is down::Nothing applied. The next up applies main, including this change."
          fi

      # The same data-loss guard as the pull request's check: a plan that destroys or
      # replaces a resource holding data stops here unless the merged pull request had
      # the allow-destroy label.
      - name: Plan
        id: plan
        if: steps.stack.outputs.up == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          terraform plan -input=false -var-file=terraform.tfvars -detailed-exitcode -out=tfplan
          code=$?
          set -e
          [ "$code" != 1 ] || exit 1
          if [ "$code" = 0 ]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No changes::main matches what's deployed."
            exit 0
          fi
          # If the stack went down between the check above and this plan, the plan would
          # build it all: creating the ECS cluster or the database means exactly that.
          if terraform show -json tfplan | jq -e '[.resource_changes[]? | select((.type | IN("aws_ecs_cluster", "aws_rds_cluster")) and .change.actions == ["create"])] | length > 0' > /dev/null; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Stack is down::this plan would build the stack, so nothing was applied. The next up applies main."
            exit 0
          fi
          echo "changes=true" >> "$GITHUB_OUTPUT"
          # Without checks/data-loss-guard.sh (checks/ is optional), fail closed: any
          # destroy or replace at all needs allow-destroy.
          if [ -x checks/data-loss-guard.sh ]; then
            at_risk=$(checks/data-loss-guard.sh tfplan)
          else
            at_risk=$(terraform show -json tfplan | jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | .address')
          fi
          if [ -n "$at_risk" ]; then
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '[.[0].labels[]?.name] | join(",")')
            if [[ ",$labels," != *",allow-destroy,"* ]]; then
              printf '%s\n' "$at_risk"
              echo "::error title=Data at risk::this plan destroys or replaces resources, and the merged pull request had no allow-destroy label. Nothing was applied."
              exit 1
            fi
            echo "::notice title=Destroy accepted::the merged pull request had the allow-destroy label."
          fi

      # tf-apply.sh retries the known IAM role-propagation race (see that file).
      - name: Apply
        if: steps.plan.outputs.changes == 'true'
        run: ./scripts/tf-apply.sh tfplan -- -var-file=terraform.tfvars

      - name: Remove the generated files
        if: always()
        run: rm -f terraform.tfvars backend.hcl tfplan

  # Claude's review of a Fleet upgrade (plan Task 38), after a nightly run whose release
  # check found one not yet reviewed, or by hand (action=review, with review_from and
  # review_to: the result goes to the run's summary, not the issue). No AWS access and
  # no Terraform secrets: the release notes it sends Claude are untrusted, so Claude gets
  # no tools, and its text reaches only the issue or the summary. A failed review only
  # warns, never failing the nightly run.
  release-review:
    name: fleet-release-review
    needs: apply
    if: always() && ((github.event_name == 'workflow_dispatch' && inputs.action == 'review') || (github.event_name == 'schedule' && needs.apply.outputs.review_to != ''))
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived Claude API token (federation rule: main only)
      issues: write # the review goes into the nightly run's release issue
    steps:
      - name: Decide what to review
        id: versions
        env:
          EVENT: ${{ github.event_name }}
          INPUT_FROM: ${{ inputs.review_from }}
          INPUT_TO: ${{ inputs.review_to }}
          NIGHTLY_FROM: ${{ needs.apply.outputs.review_from }}
          NIGHTLY_TO: ${{ needs.apply.outputs.review_to }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            from="$INPUT_FROM" to="$INPUT_TO"
          else
            from="$NIGHTLY_FROM" to="$NIGHTLY_TO"
          fi
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$from" =~ $semver ]] || [[ ! "$to" =~ $semver ]]; then
            echo "::error title=Release review::review needs review_from and review_to set to versions like 4.93.0 and 4.93.2."
            exit 1
          fi
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/fleet-homelab-gitops
          path: gitops
          persist-credentials: false

      - name: Review the releases
        id: review
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ steps.versions.outputs.from }}
          TO: ${{ steps.versions.outputs.to }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/github-id-token
        run: |
          # GitHub's identity token for this job, audience the Claude API. It lasts about
          # five minutes; the script exchanges it within seconds.
          curl -sS --fail -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          ./scripts/release-review.sh "$FROM" "$TO" gitops > "$RUNNER_TEMP/review.md"
          rm -f "$ANTHROPIC_IDENTITY_TOKEN_FILE"

      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          OUTCOME: ${{ steps.review.outcome }}
          FROM: ${{ steps.versions.outputs.from }}
          TO: ${{ steps.versions.outputs.to }}
        run: |
          if [ "$OUTCOME" != success ] || [ ! -s "$RUNNER_TEMP/review.md" ]; then
            echo "::warning title=Release review failed::Claude's review of $FROM to $TO didn't complete, so the issue is unchanged; the next nightly run tries again."
            exit 0
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            { printf "## Claude's review: Fleet %s to %s\n\n" "$FROM" "$TO"; cat "$RUNNER_TEMP/review.md"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          title="A newer Fleet release is available"
          {
            ./scripts/notify-issue.sh show "$title"
            printf "\n\n## Claude's review: Fleet %s to %s\n\n" "$FROM" "$TO"
            cat "$RUNNER_TEMP/review.md"
            printf '\n<!-- release-review: %s..%s -->\n' "$FROM" "$TO"
          } > "$RUNNER_TEMP/release.md"
          ./scripts/notify-issue.sh update "$title" "$RUNNER_TEMP/release.md"
