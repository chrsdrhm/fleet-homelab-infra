# Terraform for this stack, in three jobs:
#  - lint:  on every pull request, no AWS: private-strings check, fmt, validate, terraform test,
#           shellcheck, actionlint, zizmor, tflint.
#  - plan:  after lint, a read-only plan with the plan role, and one PR comment with a
#           summary and the full plan, masked (comments are public and NOT masked by GitHub).
#  - apply: started by hand (never on push): up or down with the apply role.
# AWS access is keyless (OIDC). The apply role in oidc.tf only trusts manual runs on
# main, so a pull request cannot get it even by editing this file. Values that identify
# the deployment come from secrets, which GitHub masks in these public logs. Forks get
# no secrets, so their plan is skipped; Dependabot PRs use Dependabot secrets.
name: Terraform
run-name: "${{ github.event_name == 'pull_request' && format('Terraform plan: {0}', github.event.pull_request.title) || format('Terraform {0}', inputs.action) }}"

on:
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        type: choice
        options:
          - up
          - down
      confirm:
        description: "For down only: type destroy"
        required: false
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"
  TF_CLI_ARGS: "-no-color"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: terraform-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: terraform-lint-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the private-strings check diffs against the base branch

      # Fails if the pull request adds any string from the PRIVATE_STRINGS secret (the
      # hostname, account ID, Okta org and so on; one per line) in a changed line, a file
      # name, a commit message, or its title and body. Reports where, never the value.
      # Runs without the secret (forks) as a skip with a notice.
      - name: Check for private strings
        env:
          PRIVATE_STRINGS: ${{ secrets.PRIVATE_STRINGS }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PRIVATE_STRINGS" ]; then
            echo "::notice title=Private-strings check skipped::This pull request runs without the PRIVATE_STRINGS secret (for example, from a fork)."
            exit 0
          fi
          patterns="$RUNNER_TEMP/private-strings"
          printf '%s\n' "$PRIVATE_STRINGS" > "$patterns"
          fail=0
          check() { scripts/check-private-strings.sh "$patterns" "$1" || fail=1; }
          git diff --name-only "$BASE...$HEAD" | check "the changed file names"
          while IFS= read -r f; do
            git diff -U0 "$BASE...$HEAD" -- "$f" | grep '^+' | grep -v '^+++' | check "the added lines of $f"
          done < <(git diff --name-only --diff-filter=d "$BASE...$HEAD")
          git log --format=%B "$BASE..$HEAD" | check "the commit messages"
          printf '%s\n%s\n' "$TITLE" "$BODY" | check "the pull request title and body"
          rm -f "$patterns"
          if [ "$fail" -ne 0 ]; then
            echo "::error title=Private string found::Remove it from the pull request (and from the history of its commits)."
          fi
          exit "$fail"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.8"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate (both roots)
        run: |
          for dir in . okta; do
            echo "== $dir"
            terraform -chdir="$dir" init -input=false -backend=false > /dev/null
            terraform -chdir="$dir" validate
          done

      # tests/*.tftest.hcl: a plan against mocked providers (no AWS or credentials) that
      # pins down the CI roles' trust, the WAF rules, the logo bucket and the budget.
      - name: terraform test
        run: terraform test

      - name: shellcheck
        run: shellcheck scripts/*.sh .githooks/*

      # Release binaries, pinned and checked against their published SHA-256 checksums,
      # so no third-party action is needed. Dependabot cannot update these: bump the
      # version and checksum together by hand.
      - name: Install actionlint and tflint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz -C bin actionlint
          curl -fsSLo tflint.zip https://github.com/terraform-linters/tflint/releases/download/v0.64.0/tflint_linux_amd64.zip
          echo "cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537  tflint.zip" | sha256sum -c -
          unzip -q tflint.zip -d bin
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Workflow files, including the shell in run: blocks (actionlint runs shellcheck).
      - name: actionlint
        run: actionlint

      # Security audit of the workflows and actions. The official image, pinned by digest.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo -e GH_TOKEN \
            ghcr.io/zizmorcore/zizmor@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 \
            --no-progress --format github .

      # Our own Terraform (not Fleet's modules) against the AWS ruleset pinned in .tflint.hcl.
      # tflint --init downloads the ruleset and verifies its signature.
      - name: tflint (both roots)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$PWD/.tflint.hcl"
          for dir in . okta; do
            echo "== $dir"
            tflint --chdir="$dir" --config="$PWD/.tflint.hcl" --format=compact
          done

  plan:
    name: terraform-plan
    needs: lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      actions: read
    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check that secrets are available
        id: gate
        env:
          ROLE: ${{ secrets.AWS_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Plan skipped::This pull request runs without the repository's secrets (for example, from a fork), so no plan can be made."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: steps.gate.outputs.run == 'true'

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        if: steps.gate.outputs.run == 'true'
        with:
          role-arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}
        env:
          FLEET_SUBDOMAIN: ${{ secrets.FLEET_SUBDOMAIN }}
          FLEET_LICENSE_KEY: ${{ secrets.FLEET_LICENSE_KEY }}
          CLOUDFLARE_ZONE_NAME: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          WAF_CI_HEADER_VALUE: ${{ secrets.WAF_CI_HEADER_VALUE }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_OWNER_ID: ${{ github.repository_owner_id }}
          GH_REPO_ID: ${{ github.repository_id }}

      # -lock=false: the plan role is read-only and cannot write the S3 lock file.
      # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error.
      - name: terraform plan
        id: plan
        if: steps.gate.outputs.run == 'true'
        run: |
          set +e
          terraform plan -input=false -lock=false -detailed-exitcode -var-file=terraform.tfvars > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

      # The comment is public and GitHub does NOT mask it, so every secret value and the
      # account ID are replaced first (the same masking the run log gets). The summary
      # (plan line + changing resources) must pass a 12-digit check or nothing is posted.
      # The full plan is added only if the whole comment stays within 60,000 characters
      # and it holds no 12-digit number; otherwise the comment links to this job instead.
      - name: Build the plan comment
        if: steps.gate.outputs.run == 'true'
        env:
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
          GH_TOKEN: ${{ github.token }}
          FLEET_SUBDOMAIN: ${{ secrets.FLEET_SUBDOMAIN }}
          CLOUDFLARE_ZONE_NAME: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          FLEET_LICENSE_KEY: ${{ secrets.FLEET_LICENSE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WAF_CI_HEADER_VALUE: ${{ secrets.WAF_CI_HEADER_VALUE }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          job_url=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name == "terraform-plan") | .html_url' | head -1)
          [ -n "$job_url" ] || job_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          mask() {
            local text="$1" v
            for v in "$FLEET_SUBDOMAIN" "$CLOUDFLARE_ZONE_NAME" "$TF_STATE_BUCKET" "$BUDGET_ALERT_EMAIL" \
                     "$FLEET_LICENSE_KEY" "$CLOUDFLARE_API_TOKEN" "$WAF_CI_HEADER_VALUE" "$account"; do
              [ -n "$v" ] && text=${text//"$v"/***}
            done
            printf '%s' "$text"
          }
          has12() { printf '%s' "$1" | grep -qE '(^|[^0-9])[0-9]{12}([^0-9]|$)'; }

          if [ "$EXITCODE" = "1" ]; then
            summary="**The plan failed.** The error is in the full output below."
          else
            headline=$(grep -m1 -E '^(Plan:|No changes\.)' plan.txt || echo "No plan line found.")
            # The backticks in the sed replacements are Markdown code spans, not shell.
            # shellcheck disable=SC2016
            rows=$(grep -E '^[[:space:]]*# .* (will be created|will be updated in-place|will be destroyed|must be replaced|will be replaced|will be read during apply)$' plan.txt \
              | sed -E 's/^[[:space:]]*# //; s/\["[^"]*"\]/["…"]/g' \
              | sed -E 's/^(.*) will be created$/| create | `\1` |/; s/^(.*) will be updated in-place$/| update | `\1` |/; s/^(.*) will be destroyed$/| destroy | `\1` |/; s/^(.*) (must|will) be replaced$/| replace | `\1` |/; s/^(.*) will be read during apply$/| read | `\1` |/' \
              | head -100 || true)
            summary="**${headline}**"
            [ -n "$rows" ] && summary+=$'\n\n| Action | Resource |\n|---|---|\n'"$rows"
          fi
          summary=$(mask "$summary")
          if has12 "$summary"; then
            echo "::error title=Not posted::the summary still contains a 12-digit number (an account ID?)"
            exit 1
          fi

          head=$'<!-- terraform-plan -->\n### Terraform plan\n\n'"$summary"
          foot=$'\n\n_The full log is in the [workflow job]('"$job_url"$')._\n'
          # Only the plan itself: drop the refresh and read progress lines (they stay in the
          # job log), keeping drift notes, the plan, warnings and errors.
          full=$(grep -vE ': (Refreshing state\.\.\.|Reading\.\.\.|Read complete after |Still (reading|refreshing)\.\.\.)' plan.txt \
            | sed -e '/./,$!d' || true)
          full=$(mask "$full")
          details=$'\n\n<details><summary>Plan details</summary>\n\n````\n'"$full"$'\n````\n\n</details>'
          if has12 "$full"; then
            details=$'\n\n_The full plan is not shown here because it contains a 12-digit number, which could be an account ID. See the [workflow job]('"$job_url"$')._'
            foot=$'\n'
          elif [ $(( ${#head} + ${#details} + ${#foot} )) -gt 60000 ]; then
            details=$'\n\n_The full plan is too long for a comment. See it in the [workflow job]('"$job_url"$')._'
            foot=$'\n'
          fi

          printf '%s' "$head$details$foot" > comment.md

      - name: Comment on the pull request
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Update this workflow's earlier comment (found by its marker) instead of adding one.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- terraform-plan -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
            echo "Updated the plan comment."
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi

      - name: Fail if the plan failed
        if: steps.gate.outputs.run == 'true' && steps.plan.outputs.exitcode == '1'
        run: |
          echo "::error title=Plan failed::terraform plan returned an error; see the 'terraform plan' step log."
          exit 1

      - name: Remove the generated files
        if: always()
        run: rm -f terraform.tfvars backend.hcl plan.txt comment.md

  apply:
    name: terraform-apply
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: terraform
      cancel-in-progress: false
    steps:
      # Fails before touching AWS, and the message shows on the run's summary page.
      - name: Check the inputs
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$ACTION" = "down" ] && [ "$CONFIRM" != "destroy" ]; then
            echo "::error title=Down not confirmed::'down' needs the confirm input set to exactly: destroy. Nothing was changed."
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
        env:
          FLEET_SUBDOMAIN: ${{ secrets.FLEET_SUBDOMAIN }}
          FLEET_LICENSE_KEY: ${{ secrets.FLEET_LICENSE_KEY }}
          CLOUDFLARE_ZONE_NAME: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          WAF_CI_HEADER_VALUE: ${{ secrets.WAF_CI_HEADER_VALUE }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_OWNER_ID: ${{ github.repository_owner_id }}
          GH_REPO_ID: ${{ github.repository_id }}

      # A GitHub App token (GitOps repo only, Actions write, revoked when the job ends)
      # lets up.sh start the GitOps workflow; this run's own token cannot. Best effort:
      # without it, up.sh still rebuilds and warns that the GitOps run did not start.
      - name: Get a token for the GitOps repo
        id: gitops-token
        if: inputs.action == 'up'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: fleet-homelab-gitops
          permission-actions: write

      # FLEET_CI_HEADER gets up.sh's health check past the WAF's US-only rule.
      - name: Up
        if: inputs.action == 'up'
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
          FLEET_CI_HEADER: ${{ secrets.WAF_CI_HEADER_VALUE }}
        run: ./scripts/up.sh

      - name: Down
        if: inputs.action == 'down'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: ./scripts/down.sh

      - name: Remove the generated files
        if: always()
        run: rm -f terraform.tfvars backend.hcl
