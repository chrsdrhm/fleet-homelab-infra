# Runs up, down or plan for this stack from GitHub, started by hand (never on push).
# AWS access is keyless: GitHub issues a short-lived OIDC token, which only the apply
# role in oidc.tf trusts, and only for manual runs on main. Values that identify the
# deployment come from repository secrets, which GitHub masks in these public logs.
name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        type: choice
        options:
          - plan
          - up
          - down
      confirm:
        description: "For down only: type destroy"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
      TF_CLI_ARGS: "-no-color"
      NO_GITOPS: "1" # a token for this repo cannot start the GitOps repo's workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      # Terraform prints ARNs, which contain the account ID; masking it here covers
      # every later step.
      - name: Mask the AWS account ID
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.8"
          terraform_wrapper: false

      - name: Write terraform.tfvars and backend.hcl
        env:
          FLEET_SUBDOMAIN: ${{ secrets.FLEET_SUBDOMAIN }}
          FLEET_LICENSE_KEY: ${{ secrets.FLEET_LICENSE_KEY }}
          CLOUDFLARE_ZONE_NAME: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          WAF_CI_HEADER_VALUE: ${{ secrets.WAF_CI_HEADER_VALUE }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_OWNER_ID: ${{ github.repository_owner_id }}
          GH_REPO_ID: ${{ github.repository_id }}
        run: |
          umask 077
          {
            printf 'fleet_subdomain      = "%s"\n' "$FLEET_SUBDOMAIN"
            printf 'fleet_license_key    = "%s"\n' "$FLEET_LICENSE_KEY"
            printf 'cloudflare_zone_name = "%s"\n' "$CLOUDFLARE_ZONE_NAME"
            printf 'cloudflare_api_token = "%s"\n' "$CLOUDFLARE_API_TOKEN"
            printf 'budget_alert_email   = "%s"\n' "$BUDGET_ALERT_EMAIL"
            printf 'waf_ci_header_value  = "%s"\n' "$WAF_CI_HEADER_VALUE"
            printf 'github_owner         = "%s"\n' "$GH_OWNER"
            printf 'github_owner_id      = "%s"\n' "$GH_OWNER_ID"
            printf 'github_repo_id       = "%s"\n' "$GH_REPO_ID"
          } > terraform.tfvars
          printf 'bucket = "%s"\n' "$TF_STATE_BUCKET" > backend.hcl

      - name: terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Plan
        if: inputs.action == 'plan'
        run: terraform plan -input=false -var-file=terraform.tfvars

      - name: Up
        if: inputs.action == 'up'
        run: ./scripts/up.sh

      - name: Down
        if: inputs.action == 'down'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: ./scripts/down.sh

      - name: Remove the generated files
        if: always()
        run: rm -f terraform.tfvars backend.hcl
