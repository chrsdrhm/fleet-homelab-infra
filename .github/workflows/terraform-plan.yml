# Runs a read-only terraform plan on every pull request that touches Terraform, and
# keeps one comment on the PR with a REDACTED summary: the plan line and the list of
# changing resource addresses. The full plan stays in this run's log, where GitHub
# masks secret values; a PR comment is not masked, so the raw plan is never posted.
#
# Forks get no secrets or OIDC token, so their check skips. Dependabot PRs get only
# Dependabot secrets, so the same values are stored there too.
name: Terraform Plan

on:
  pull_request:
    paths:
      - "**.tf"
      - ".terraform.lock.hcl"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
      TF_CLI_ARGS: "-no-color"
    steps:
      - name: Check that secrets are available
        id: gate
        env:
          ROLE: ${{ secrets.AWS_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Plan skipped::This pull request runs without the repository's secrets (for example, from a fork), so no plan can be made."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.gate.outputs.run == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Mask the AWS account ID
        if: steps.gate.outputs.run == 'true'
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          terraform_version: "1.14.8"
          terraform_wrapper: false

      - name: Write terraform.tfvars and backend.hcl
        if: steps.gate.outputs.run == 'true'
        env:
          FLEET_SUBDOMAIN: ${{ secrets.FLEET_SUBDOMAIN }}
          FLEET_LICENSE_KEY: ${{ secrets.FLEET_LICENSE_KEY }}
          CLOUDFLARE_ZONE_NAME: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          WAF_CI_HEADER_VALUE: ${{ secrets.WAF_CI_HEADER_VALUE }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_OWNER_ID: ${{ github.repository_owner_id }}
          GH_REPO_ID: ${{ github.repository_id }}
        run: |
          umask 077
          {
            printf 'fleet_subdomain      = "%s"\n' "$FLEET_SUBDOMAIN"
            printf 'fleet_license_key    = "%s"\n' "$FLEET_LICENSE_KEY"
            printf 'cloudflare_zone_name = "%s"\n' "$CLOUDFLARE_ZONE_NAME"
            printf 'cloudflare_api_token = "%s"\n' "$CLOUDFLARE_API_TOKEN"
            printf 'budget_alert_email   = "%s"\n' "$BUDGET_ALERT_EMAIL"
            printf 'waf_ci_header_value  = "%s"\n' "$WAF_CI_HEADER_VALUE"
            printf 'github_owner         = "%s"\n' "$GH_OWNER"
            printf 'github_owner_id      = "%s"\n' "$GH_OWNER_ID"
            printf 'github_repo_id       = "%s"\n' "$GH_REPO_ID"
          } > terraform.tfvars
          printf 'bucket = "%s"\n' "$TF_STATE_BUCKET" > backend.hcl

      - name: terraform init
        if: steps.gate.outputs.run == 'true'
        run: terraform init -input=false -backend-config=backend.hcl

      # -lock=false: the plan role is read-only and cannot write the S3 lock file.
      # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error.
      - name: terraform plan
        id: plan
        if: steps.gate.outputs.run == 'true'
        run: |
          set +e
          terraform plan -input=false -lock=false -detailed-exitcode -var-file=terraform.tfvars > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

      - name: Build the redacted summary
        if: steps.gate.outputs.run == 'true'
        env:
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R1: ${{ secrets.FLEET_SUBDOMAIN }}
          R2: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
          R3: ${{ secrets.TF_STATE_BUCKET }}
          R4: ${{ secrets.BUDGET_ALERT_EMAIL }}
          R5: ${{ secrets.FLEET_LICENSE_KEY }}
          R6: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R7: ${{ secrets.WAF_CI_HEADER_VALUE }}
        run: |
          export R8="$(aws sts get-caller-identity --query Account --output text)"
          python3 .github/scripts/plan_summary.py plan.txt > summary.md

      - name: Comment on the pull request
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file summary.md

      - name: Fail if the plan failed
        if: steps.gate.outputs.run == 'true' && steps.plan.outputs.exitcode == '1'
        run: |
          echo "::error title=Plan failed::terraform plan returned an error; see the 'terraform plan' step log."
          exit 1

      - name: Remove the generated files
        if: always()
        run: rm -f terraform.tfvars backend.hcl plan.txt summary.md
