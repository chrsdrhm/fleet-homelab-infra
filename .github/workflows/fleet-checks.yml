# Checks on Fleet and the running stack that don't run Terraform (terraform.yml has the
# Terraform jobs):
#  - fleet-release: daily, keeps a pull request open that upgrades fleet.Dockerfile to
#           Fleet's newest release (scripts/release-pr.sh, as the release GitHub App),
#           with Claude's review of the releases in between against this setup
#           (scripts/release-review.sh) in its body. By hand, action=release does the
#           same, and action=review only the review. No AWS access.
#  - health-scan: started by a successful up or apply on merge (terraform.yml), and by
#           hand (action=scan): runs the read-only health scan with the scan role
#           (scripts/health-scan.sh), has Claude compare it with the baseline
#           (scripts/health-review.sh), writes both to the run's summary, and opens an
#           issue if something is outside the baseline. Only warns when it fails.
# Both sign in to the Claude API with workload identity federation (no API key), and
# give Claude no tools. Values that identify the deployment come from secrets, which
# GitHub masks in these public logs.
name: Fleet checks
run-name: "${{ (github.event_name == 'schedule' || inputs.action == 'release') && 'Fleet release check' || inputs.action == 'review' && format('Fleet release review: {0} to {1}', inputs.review_from, inputs.review_to) || inputs.after == 'up' && 'Health scan after up' || inputs.after == 'merge' && 'Health scan after apply on merge' || 'Health scan' }}"

on:
  # Daily at noon in Chicago (following daylight saving). Not time-sensitive, so GitHub
  # starting it late doesn't matter.
  schedule:
    - cron: "0 12 * * *"
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        type: choice
        options:
          - scan
          - release
          - review
      review_from:
        description: "For review only: the version upgraded from, like 4.93.0"
        required: false
        type: string
      review_to:
        description: "For review only: the version upgraded to, like 4.93.2"
        required: false
        type: string
      after:
        description: "For scan only: what started it (up and merge are set by terraform.yml and scan its 2 hours; by hand scans the last day)"
        required: false
        type: choice
        default: hand
        options:
          - hand
          - up
          - merge

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

defaults:
  run:
    shell: bash

jobs:
  # Daily, with no AWS and no Terraform secrets: whether Fleet has a newer release, and if
  # so a pull request that upgrades to it, with Claude's review of the releases in between
  # (plan Tasks 38 and 39); by hand, action=release does the same. action=review (with
  # review_from and review_to) does only the review, and it goes to the run's summary. The release notes it sends Claude are
  # untrusted, so Claude gets no tools, and its text reaches only the pull request's body
  # or the summary; the release GitHub App's token is made after the review, and only the
  # last step holds it. A failed review only warns.
  fleet-release:
    name: fleet-release
    if: github.event_name == 'schedule' || inputs.action == 'release' || inputs.action == 'review'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived Claude API token (federation rule: main only)
      pull-requests: read # the open upgrade pull request's body (the app's token writes it)
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Dependabot can't watch the Fleet image: fleetdm/fleet has tens of thousands of
      # tags (one per branch build), and listing them never finishes. Instead, daily,
      # compare fleet.Dockerfile with Fleet's newest release, and keep one pull request
      # open that upgrades to it (scripts/release-pr.sh); a newer release gets a new one,
      # and the older one is closed. No waiting period (unlike Dependabot's cooldown):
      # it's a homelab, and nothing upgrades until it's merged. Claude's review is in the
      # pull request's body with a marker naming the versions; while the marker matches,
      # the pull request is left alone, so each upgrade is reviewed once. A failed review
      # leaves no marker, so the next day tries again.
      - name: Check for a newer Fleet release
        id: release
        if: github.event_name == 'schedule' || inputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_APP: ${{ secrets.RELEASE_APP_CLIENT_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          current=$(sed -n 's|^FROM fleetdm/fleet:v||p' fleet.Dockerfile)
          # Captured first, so an API error fails the step instead of reading as "none".
          releases=$(gh api 'repos/fleetdm/fleet/releases?per_page=100')
          latest=$(jq -r '.[]
            | select((.draft or .prerelease) | not)
            | select(.tag_name | test("^fleet-v[0-9]+\\.[0-9]+\\.[0-9]+$"))
            | .tag_name | ltrimstr("fleet-v")' <<< "$releases" | sort -V | tail -n 1)
          if [ -z "$current" ] || [ -z "$latest" ]; then
            echo "::error title=Fleet release check::Couldn't read the current version ('$current') or the newest release ('$latest')."
            exit 1
          fi
          if [ "$HAS_APP" != true ]; then
            echo "::warning title=No release app::Fleet's newest release is $latest and fleet.Dockerfile is on $current. Set up the release GitHub App (docs/github-setup.md, step 11) to get an upgrade pull request."
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)" = "$current" ]; then
            echo "fleet.Dockerfile is on $current, the newest release."
            # An upgrade pull request still open is out of date (main got there another way).
            if [ -n "$(./scripts/release-pr.sh show)" ]; then
              echo "close=$current" >> "$GITHUB_OUTPUT"
            fi
          elif ./scripts/release-pr.sh show "$latest" | grep -qF "<!-- release-review: $current..$latest -->"; then
            echo "The upgrade pull request already has a review of $current to $latest."
          else
            echo "review_from=$current" >> "$GITHUB_OUTPUT"
            echo "review_to=$latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide what to review
        id: versions
        env:
          ACTION: ${{ inputs.action }}
          INPUT_FROM: ${{ inputs.review_from }}
          INPUT_TO: ${{ inputs.review_to }}
          NIGHTLY_FROM: ${{ steps.release.outputs.review_from }}
          NIGHTLY_TO: ${{ steps.release.outputs.review_to }}
        run: |
          if [ "$ACTION" = review ]; then
            from="$INPUT_FROM" to="$INPUT_TO"
          elif [ -z "$NIGHTLY_TO" ]; then
            echo "Nothing to review."
            exit 0
          else
            from="$NIGHTLY_FROM" to="$NIGHTLY_TO"
          fi
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$from" =~ $semver ]] || [[ ! "$to" =~ $semver ]]; then
            echo "::error title=Release review::review needs review_from and review_to set to versions like 4.93.0 and 4.93.2."
            exit 1
          fi
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"

      # Public, so this job's own token can read it (up's GitHub App token is for
      # starting its workflow, which this token can't do).
      - name: Check out the GitOps repository
        if: steps.versions.outputs.to != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/fleet-homelab-gitops
          path: gitops
          persist-credentials: false

      - name: Review the releases
        id: review
        if: steps.versions.outputs.to != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ steps.versions.outputs.from }}
          TO: ${{ steps.versions.outputs.to }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/github-id-token
        run: |
          # GitHub's identity token for this job, audience the Claude API. It lasts about
          # five minutes; the script exchanges it within seconds.
          curl -sS --fail -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          ./scripts/release-review.sh "$FROM" "$TO" gitops > "$RUNNER_TEMP/review.md"
          rm -f "$ANTHROPIC_IDENTITY_TOKEN_FILE"

      # Made here, after the review, so no step that handles the release notes holds it.
      - name: Get a token for the upgrade pull request
        id: app-token
        if: inputs.action != 'review' && (steps.versions.outputs.to != '' || steps.release.outputs.close != '')
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the upgrade pull request
        if: steps.versions.outputs.to != '' || steps.release.outputs.close != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTION: ${{ inputs.action }}
          OUTCOME: ${{ steps.review.outcome }}
          OWNER: ${{ github.repository_owner }}
          FROM: ${{ steps.versions.outputs.from }}
          TO: ${{ steps.versions.outputs.to }}
          CLOSE: ${{ steps.release.outputs.close }}
        run: |
          if [ -n "$CLOSE" ]; then
            ./scripts/release-pr.sh close "fleet.Dockerfile is already on $CLOSE, the newest release; closing."
            exit 0
          fi
          reviewed=true
          if [ "$OUTCOME" != success ] || [ ! -s "$RUNNER_TEMP/review.md" ]; then
            reviewed=false
            echo "::warning title=Release review failed::Claude's review of $FROM to $TO didn't complete; the next daily run tries again."
          fi
          if [ "$ACTION" = review ]; then
            if [ "$reviewed" = true ]; then
              { printf "## Claude's review: Fleet %s to %s\n\n" "$FROM" "$TO"; cat "$RUNNER_TEMP/review.md"; } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          # shellcheck disable=SC2016 # the backticks are Markdown, for the pull request
          {
            printf '@%s Fleet %s is out; `fleet.Dockerfile` is on %s. This pull request upgrades it.\n\n' "$OWNER" "$TO" "$FROM"
            printf 'Release notes: https://github.com/fleetdm/fleet/releases/tag/fleet-v%s\n\n' "$TO"
            printf '**Merging it upgrades Fleet.** If the stack is up, the apply on merge snapshots the database first (`fleet-homelab-pre-upgrade-*`), then the migrations add-on runs the database migrations for the new version and rolls it out. If it is down, the next `up` upgrades it, and the teardown snapshot is the restore point. Read the review below first; for anything it says must change, run `/fleet-upgrade` on this pull request, or push to its branch, `fleet-release-%s`. See `docs/upgrading-fleet.md`.\n' "$TO"
            if [ "$reviewed" = true ]; then
              printf "\n## Claude's review: Fleet %s to %s\n\n" "$FROM" "$TO"
              cat "$RUNNER_TEMP/review.md"
              printf '\n<!-- release-review: %s..%s -->\n' "$FROM" "$TO"
            else
              printf "\n_Claude's review didn't complete; the next daily run tries again._\n"
            fi
          } > "$RUNNER_TEMP/release.md"
          ./scripts/release-pr.sh open "$TO" "Upgrade Fleet to $TO" "$RUNNER_TEMP/release.md"

  health-scan:
    name: health-scan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'scan'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # the scan role (AWS) and a short-lived Claude API token, both main only
      issues: write # "The health scan found something to look at"
    env:
      TITLE: The health scan found something to look at
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Read-only, and only the calls the scan makes (the scan role in oidc.tf), so this
      # job never holds the apply role. Every step from here only warns on failure.
      - name: Get AWS credentials (OIDC, scan role)
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_SCAN_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      # The scan masks identifying values itself; this covers anything it misses in the
      # log. Its window covers the up (about half an hour); by hand, the last day.
      - name: Scan
        id: scan
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FLEET_URL: https://${{ secrets.FLEET_SUBDOMAIN }}
          FLEET_CI_HEADER: ${{ secrets.WAF_CI_HEADER_VALUE }}
          AFTER: ${{ inputs.after }}
        run: |
          echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
          if [ "$AFTER" = up ]; then
            hours=2 when="in CI, just after an up"
          elif [ "$AFTER" = merge ]; then
            hours=2 when="in CI, just after an apply on merge (a change went live, such as a Fleet upgrade)"
          else
            hours=24 when="in CI, started by hand"
          fi
          { echo "Run: $when."; echo; ./scripts/health-scan.sh "$hours"; } > "$RUNNER_TEMP/scan.md"
          {
            echo "## Health scan"
            echo
            echo "<details><summary>The scan's figures</summary>"
            echo
            cat "$RUNNER_TEMP/scan.md"
            echo
            echo "</details>"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare with the baseline
        id: review
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        env:
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/github-id-token
        run: |
          curl -sS --fail -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          ./scripts/health-review.sh "$RUNNER_TEMP/scan.md" > "$RUNNER_TEMP/review.md"
          rm -f "$ANTHROPIC_IDENTITY_TOKEN_FILE"

      # An issue only when the verdict isn't ✅; a clean scan closes an open one.
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AWS_OUTCOME: ${{ steps.aws.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          if [ "$AWS_OUTCOME" != success ]; then
            echo "::warning title=Health scan skipped::Couldn't get the scan role (is the AWS_SCAN_ROLE_ARN secret set, and oidc.tf applied?)."
            exit 0
          elif [ "$SCAN_OUTCOME" != success ]; then
            echo "::warning title=Health scan failed::The scan didn't complete; run /health-scan by hand."
            exit 0
          elif [ "$REVIEW_OUTCOME" != success ] || [ ! -s "$RUNNER_TEMP/review.md" ]; then
            echo "::warning title=Health review failed::Claude's comparison with the baseline didn't complete; the figures are in this run's summary."
            exit 0
          fi
          { echo "## Claude's comparison with the baseline"; echo; cat "$RUNNER_TEMP/review.md"; } >> "$GITHUB_STEP_SUMMARY"
          # Only the first line: health-review.sh makes sure it's the verdict.
          if head -n 1 "$RUNNER_TEMP/review.md" | grep -q '^\*\*Verdict:\*\* ✅'; then
            ./scripts/notify-issue.sh resolve "$TITLE" "A later scan was within the baseline: $RUN_URL"
          else
            # shellcheck disable=SC2016 # the backticks are Markdown, for the issue body
            {
              printf '@%s The health scan in %s found something outside the baseline. The figures are in the run summary; `/health-scan` looks closer. This issue closes itself after a clean scan.\n\n' "$OWNER" "$RUN_URL"
              cat "$RUNNER_TEMP/review.md"
            } > "$RUNNER_TEMP/notice.md"
            ./scripts/notify-issue.sh report "$TITLE" "$RUNNER_TEMP/notice.md"
            echo "::warning title=Health scan::Something is outside the baseline; see the issue."
          fi
