# Weekly update PRs for the pinned GitHub Actions (SHA pins, tag in a trailing comment)
# and for the Terraform providers and Fleet modules in both roots.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a hijacked one is usually caught
    # and pulled before it reaches this repo.
    cooldown:
      default-days: 7
  - package-ecosystem: terraform
    directories:
      - /
      - /okta
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a hijacked one is usually caught
    # and pulled before it reaches this repo.
    cooldown:
      default-days: 7
