# Weekly update PRs for the pinned GitHub Actions (SHA pins, tag in a trailing comment)
# for the Terraform providers and Fleet modules in both roots, and for the Fleet server
# image in fleet.Dockerfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a hijacked one is usually caught
    # and pulled before it reaches this repo.
    cooldown:
      default-days: 7
  - package-ecosystem: terraform
    directories:
      - /
      - /okta
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a hijacked one is usually caught
    # and pulled before it reaches this repo.
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The same week's wait. Fleet releases about every three weeks, so each one still
    # arrives well before the next.
    cooldown:
      default-days: 7
