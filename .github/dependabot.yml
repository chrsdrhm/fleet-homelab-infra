# Weekly update PRs for the pinned GitHub Actions (SHA pins, tag in a trailing comment)
# and for the Terraform providers and Fleet modules in both roots.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories:
      - /
      - /okta
    schedule:
      interval: weekly
