# Shared setup for the Terraform jobs: AWS credentials through OIDC (the caller picks
# the role), the account ID masked, Terraform installed, and terraform init with the
# state bucket from TF_STATE_BUCKET (step env, since a composite action cannot read
# secrets itself). Nothing is written to disk: the jobs pass the variables as TF_VAR_*
# env on the steps that run Terraform.
name: terraform-setup
description: Log in to AWS with a role, install Terraform, and init.

inputs:
  role-arn:
    description: IAM role to assume through OIDC.
    required: true

runs:
  using: composite
  steps:
    - name: Get AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: us-east-1
        mask-aws-account-id: true

    # Terraform prints ARNs, which contain the account ID; masking it here covers every
    # later step.
    - name: Mask the AWS account ID
      shell: bash
      run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

    - name: Install Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: "1.14.8"
        terraform_wrapper: false

    - name: terraform init
      shell: bash
      run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
